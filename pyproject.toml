[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palimind"
version = "0.1.0"
description = "Local Multimodal RAG CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "pymupdf>=1.24",
    "python-pptx>=0.6.23",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "turbovec>=0.1",
    "pillow>=10.2",
    "watchdog>=4.0",
    "sentence-transformers>=3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "faster-whisper>=1.0.0",
    "soundfile>=0.12.0",
    "kokoro-onnx>=0.3.0",
    "cryptography>=42.0",
    "easyocr>=1.7",
]

[project.scripts]
pm = "core.cli.main:app"

[project.optional-dependencies]
ocr = []
hotkey = [
    "pynput>=1.7.6",
    "pyperclip>=1.9.0",
    "requests>=2.32.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "hotkey*"]
