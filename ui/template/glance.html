<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaliGlance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono&display=swap"
        rel="stylesheet"
    />
    <link rel="stylesheet" href="/ui/static/glance.css" />
    <!-- Markdown rendering — same CDNs as index.html -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/marked-katex-extension@4.0.0/dist/marked-katex-extension.umd.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>
    <div class="glance-shell">

        <!-- Draggable header bar -->
        <div class="glance-header">
            <div class="glance-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/>
                </svg>
                <span>PaliGlance</span>
            </div>
            <div class="glance-status">
                <span id="glance-status-dot" class="glance-dot" title="No screenshot"></span>
                <span id="glance-status-text" class="glance-status-label">No capture</span>
            </div>
        </div>

        <!-- Messages area -->
        <div id="glance-messages" class="glance-messages">
            <div class="glance-empty">
                <p>Ask anything about your screen.</p>
                <span class="glance-hint">Press <kbd>Esc</kbd> to dismiss</span>
            </div>
        </div>

        <!-- Input wrapper — clean, matches workspace style -->
        <div class="glance-input-wrapper">
            <div class="glance-input-bar">
                <textarea
                    id="glance-input"
                    placeholder="Ask about your screen…"
                    rows="1"
                    autofocus
                ></textarea>
                <button id="glance-send-btn" title="Send" aria-label="Send">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="19" x2="12" y2="5"></line>
                        <polyline points="5 12 12 5 19 12"></polyline>
                    </svg>
                </button>
            </div>
            <div class="glance-input-footer">
                <div id="glance-model-area" class="glance-model-area">
                    <button id="glance-model-btn" class="glance-model-pill glance-model-pill--btn" type="button">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="3"/>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                        </svg>
                        <span id="glance-model-name">Loading...</span>
                        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </button>
                    <!-- Tabbed dropdown panel -->
                    <div id="glance-model-dropdown" class="glance-model-dropdown" style="display:none">
                        <div class="glance-ms-tab-bar">
                            <button class="glance-ms-tab active" data-tab="models">Models</button>
                            <button class="glance-ms-tab" data-tab="cookbook">Cookbook</button>
                        </div>
                        <!-- Models tab -->
                        <div id="glance-ms-models" class="glance-ms-panel">
                            <input type="text" id="glance-model-search" class="glance-model-search"
                                   placeholder="Search models..." autocomplete="off"/>
                            <div id="glance-model-list" class="glance-model-list"></div>
                        </div>
                        <!-- Cookbook tab -->
                        <div id="glance-ms-cookbook" class="glance-ms-panel" style="display:none">
                            <div id="glance-cookbook-recs" class="glance-cookbook-list">
                                <span class="glance-loading">Loading recommendations...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    <script src="/ui/static/glance.js"></script>
</body>
</html>
