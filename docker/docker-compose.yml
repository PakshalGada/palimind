services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    # Bind to loopback only by default. Set PALIMIND_ALLOW_REMOTE=true and a
    # strong PALIMIND_API_TOKEN to expose it deliberately (e.g. behind a
    # reverse proxy with TLS).
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      PALIMIND_ENABLE_PALIAGENTS: "true"
      PALIMIND_ALLOW_REMOTE: "true"
      # Required: the container refuses to start without an explicit secret.
      PALIMIND_API_TOKEN: ${PALIMIND_API_TOKEN:?set PALIMIND_API_TOKEN to a long random value}
    volumes:
      - palimind_data:/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # GPU profile: run with `docker compose --profile gpu up`
    profiles: ["", "gpu"]

  ollama-gpu:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    profiles: ["gpu-only"]

volumes:
  palimind_data:
  ollama_models:
