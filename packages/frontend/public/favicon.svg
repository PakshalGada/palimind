<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101a2e"/>
      <stop offset="1" stop-color="#17223b"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.55" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect x="28" y="28" width="8" height="8" rx="2" fill="#94a3b8" opacity="0.13"/>
    </pattern>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#dots)"/>

  <!-- Pixel P: 64px grid, left-aligned at 192. Crisp edges, no text. -->
  <g shape-rendering="crispEdges">
    <rect x="320" y="192" width="320" height="64" fill="url(#mark)"/>
    <rect x="256" y="256" width="64" height="576" fill="url(#mark)"/>
    <rect x="640" y="256" width="64" height="128" fill="url(#mark)"/>
    <rect x="320" y="384" width="320" height="64" fill="url(#mark)"/>

    <!-- Accent pixels: the "mind" spark, not a second letter. -->
    <rect x="640" y="192" width="64" height="64" fill="url(#accent)"/>
    <rect x="704" y="256" width="64" height="64" fill="url(#accent)" opacity="0.85"/>
    <rect x="704" y="448" width="64" height="64" fill="url(#accent)" opacity="0.55"/>
  </g>

  <!-- A small four-point spark to the lower right. -->
  <g fill="#fbbf24" filter="url(#glow)">
    <rect x="784" y="704" width="32" height="32" rx="6"/>
    <rect x="816" y="736" width="24" height="24" rx="5" opacity="0.85"/>
    <rect x="752" y="736" width="24" height="24" rx="5" opacity="0.6"/>
    <rect x="816" y="672" width="24" height="24" rx="5" opacity="0.6"/>
  </g>

  <rect x="1" y="1" width="1022" height="1022" rx="223" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
</svg>
