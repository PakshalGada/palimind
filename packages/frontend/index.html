<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Palimind - AI Workspace for Everything</title>
    <script>
      // Apply the persisted/system theme before first paint to avoid a flash.
      (function () {
        try {
          var theme =
            localStorage.getItem('palimind:theme') ||
            localStorage.getItem('theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          }
          var root = document.documentElement;
          root.classList.add(theme === 'light' ? 'light-mode' : 'dark-mode');
          root.dataset.theme = theme;
          // Interface style (see src/design/uiStyle.ts); pixel is the default.
          var style = localStorage.getItem('palimind:ui-style');
          root.dataset.uiStyle = style === 'classic' ? 'classic' : 'pixel';
        } catch (e) {
          document.documentElement.dataset.uiStyle = 'pixel';
          /* ignore */
        }
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Fonts are bundled locally (see design/tokens.css) so the app is fully
         offline-capable and never flashes a fallback from a network request. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
