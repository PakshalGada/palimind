# Palimind desktop-native workspace.
#
# This workspace vendors the Linux-capable half of agent-desktop v1.1.0
# (Apache-2.0). Only `crates/core` and `crates/linux` are built: the Windows
# and macOS crates stay upstream and are not part of the Palimind build.
#
# See docs/computer-use.md and NOTICE for provenance and licence obligations.
[workspace]
members = [
    "vendor/agent-desktop/crates/core",
    "vendor/agent-desktop/crates/linux",
    "palimind-desktop",
]
default-members = [
    "vendor/agent-desktop/crates/core",
    "vendor/agent-desktop/crates/linux",
    "palimind-desktop",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
# Upstream agent-desktop pins (v1.1.0 / commit 17467da5). Keep these pinned so
# rebases are mechanical.
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.23"
rustc-hash = "2.1"
libc = "0.2"
smallvec = { version = "1.13", features = ["serde", "union"] }
agent-desktop-core = { path = "vendor/agent-desktop/crates/core" }
agent-desktop-linux = { path = "vendor/agent-desktop/crates/linux" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "allow"
unused_must_use = "deny"
let_underscore_drop = "allow"

[workspace.lints.clippy]
# Vendored upstream code predates clippy 1.89's stricter collapsible_if form;
# allowing it keeps the fork diff limited to behaviour, not formatting churn.
collapsible_if = "allow"
dbg_macro = "deny"
todo = "warn"
needless_collect = "warn"
redundant_clone = "allow"
unwrap_used = "allow"
expect_used = "allow"
needless_pass_by_value = "allow"
manual_let_else = "allow"
items_after_statements = "allow"
