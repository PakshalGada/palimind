[package]
name = "palimind-desktop"
version = "0.1.0"
description = "Palimind Linux desktop-control native layer (AT-SPI2 + kernel input)"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false

[[bin]]
name = "palimind-desktop"
path = "src/main.rs"

[features]
default = ["uinput"]
# The kernel-input backend is compiled in by default but is only selected at
# runtime when the operator opts in. Building without it keeps the binary
# buildable on kernels/headers without the input constants.
uinput = []

[dependencies]
agent-desktop-core.workspace = true
agent-desktop-linux.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
base64.workspace = true
libc.workspace = true
zbus = "=5.19.0"
futures-lite = "=2.6.1"
futures-util = { version = "=0.3.33", default-features = false, features = ["alloc"] }
async-io = "=2.6.0"

[lints]
workspace = true
